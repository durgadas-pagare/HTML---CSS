<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 300px;
            text-align: center;
        }

        h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            box-sizing: border-box;
            border: 1px solid #dbdbdb;
            background-color: #fafafa;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        p {
            font-size: 14px;
            margin-top: 25px;
        }

        a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1></h1>

        <form>
            <input
                type="text"
                placeholder="Phone number, username or email"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">Log in</button>
        </form>

        <p>Don't have an account? <a href="#">Sign up</a></p>

    </div>

</body>
</html>
